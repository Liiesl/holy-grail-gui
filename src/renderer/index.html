<!-- src/renderer/index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <!-- 
      REMOVED: <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
      
      ADDED: A much stricter and more secure Content Security Policy.
      - default-src 'self': By default, only allow loading resources from the app itself.
      - script-src 'self': Only allow scripts from the app's own files. No inline or eval scripts.
      - style-src 'self' 'unsafe-inline': Allow stylesheets from app files AND inline styles. 
        (This is often a necessary compromise for UI libraries or dynamic styling).
      - object-src 'none': Disallow plugins like Flash.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none';">
    
    <title>Markdown WYSIWYG Notes</title>
    <link rel="stylesheet" href="../../external/FontAwesome/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Add styles for the loader -->
    <style>
      .loader {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-size: 18px; color: #888;
      }
      .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Add the loader and hide the app initially -->
    <div id="loader" class="loader">Loading...</div>
    <div id="app" class="hidden"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
