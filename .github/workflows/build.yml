# .github/workflows/build.yml

name: Build Windows Executable

# Controls when the action will run. 
# This workflow runs on pushes to the main branch and can also be triggered manually.
on:
  push:
    branches: [ "stable" ]
  workflow_dispatch:

jobs:
  build:
    # The type of runner that the job will run on. We use windows-latest for a Windows build.
    runs-on: windows-latest

    steps:
      # Step 1: Check out your repository's code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js. electron-builder requires a specific Node version sometimes.
      # Using a recent LTS version like 20 is a safe bet.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install npm dependencies.
      # 'npm ci' is recommended for CI environments as it's faster and more reliable.
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the build script defined in package.json
      - name: Build application
        run: npm run build

      # Step 5: Upload the build artifact (the .exe installer)
      # This makes the file available for download from the GitHub Actions run page.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hggui-windows-installer
          path: dist/*.exe