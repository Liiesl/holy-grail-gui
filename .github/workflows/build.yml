# .github/workflows/build.yml

name: Build and Release Windows Application

# This workflow now triggers when you push a version tag (e.g., v1.0.1, v1.2.0).
# This is the standard practice for creating releases.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    # Grant the GITHUB_TOKEN permissions to create a release and upload assets.
    permissions:
      contents: write
      
    steps:
      # Step 1: Check out your repository's code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: NEW - Verify that the package.json version matches the Git tag
      - name: Verify package.json version matches tag
        run: |
          $packageVersion = (Get-Content ./package.json | ConvertFrom-Json).version
          echo "Version in package.json: $packageVersion"

          $gitTag = "${{ github.ref_name }}"
          echo "Git tag: $gitTag"
          
          $expectedTag = "v$packageVersion"

          if ($gitTag -ne $expectedTag) {
            echo "Error: Git tag '$gitTag' does not match package.json version '$expectedTag'."
            exit 1
          } else {
            echo "Version check passed. Proceeding with the build."
          }
        shell: pwsh

      # Step 3: Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 4: Install npm dependencies
      - name: Install dependencies
        run: npm install

      # Step 5: Build and publish the application
      # We add '--publish always' to instruct electron-builder to create a GitHub Release.
      # The GITHUB_TOKEN is required for electron-builder to have permission to create the release on your behalf.
      - name: Build and release application
        run: npm run build -- --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The 'Upload artifact' step is no longer needed, as electron-builder now uploads
      # the assets directly to the GitHub Release it creates. The release assets are
      # what electron-updater will use, not the workflow artifacts.